[package]
name = "zstats-app"
version = "0.5.0"
edition = "2024"

# The package cannot itself be called `zstats` — that name is taken by the
# metrics crate it depends on — but the binary target can: bin names play no
# part in dependency resolution. This is what names the executable inside
# the bundle (Contents/MacOS/zstats).
[[bin]]
name = "zstats"
path = "src/main.rs"

# cargo-bundle has no field for `LSUIElement`, so `make bundle` writes it into
# Info.plist afterwards — see the Makefile.
[package.metadata.bundle]
name = "zstats"
identifier = "com.github.vicanso.zstats"
icon = ["icons/zstats.icns"]
copyright = "Copyright © 2026 Tree xie. All rights reserved."
category = "public.app-category.utilities"
# NSH's AppKit backend: macOS 14 (docs/nsh-migration.md, decided 2026-10-24).
osx_minimum_system_version = "14.0"
short_description = "A menu bar metrics panel written in Rust and NSH."

[dependencies]

# The interface: NSH (`src/nsh/`, docs/nsh-migration.md — gpui-kit until
# 2026-10-25). No `js` on the platform crates: every root is Rust, and
# QuickJS stays out of the binary.
nsh-core = "0.2.0"
nsh-base = "0.2.0"
# tinyvec 1.13.0 (crates.io, 2026-09-03) does not compile on rustc 1.98:
# `use alloc::vec::{self, Vec}` shadows the `vec!` macro (Lokathor/tinyvec#225).
# 1.13.1 restored `vec!`; keep a floor so `cargo update` cannot pick 1.13.0.
# Pulled in by fontdb → usvg → resvg.
tinyvec = "1.13.3"

# Embedded metrics collection. `frontend` brings the alert rule engine,
# rolling per-process averages and the settings model — and deliberately no
# tokio. `client` (the daemon's unix-socket probe) is left off for that reason.
zstats = { version = "0.7.2", default-features = false, features = ["frontend"] }
# Dates for `records::read_range`, whose parameters are `jiff::civil::Date`
# and whose `MetricRecord::timestamp` is a `jiff::Timestamp`. Same version
# zstats already pins, so this resolves to the one copy it is already
# building — confirm with `cargo tree -i jiff` after any bump.
jiff = "0.2.37"
# The collector's tick channel and the banners' click channel
# (`metrics::spawn`, `notify::start`), received on threads of their own.
smol = "2.0.2"
# Embeds `assets/` (fonts now; locales next) and zstd-compresses them in
# release. `default-features` off so debug builds embed too, instead of
# reading the folder at runtime.
# `include-exclude` powers the `#[include]` allowlist in `src/assets.rs`.
rust-embed = { version = "8.12.0", default-features = false, features = [
    "compression",
    "include-exclude",
] }
# Locale files live in `assets/locales/` (compressed by rust-embed). The
# `i18n!` macro is pointed at the empty `locales_stub/` so it does not
# codegen a  backend map; `i18n_loader` inflates one locale on first use.
# Minimal blocking HTTP client for the app's few network calls: the
# user-triggered clean-hints / DMG fetches plus one silent version
# check every couple of days (updater.rs). rustls avoids a
# native TLS dependency; socks-proxy so a configured socks:// URI
# actually connects (same shape as zedis).
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
    "socks-proxy",
] }
# SHA-256 for the update download, verified against the release's own
# SHA256SUMS. In-process rather than shelling out to `shasum`: the
# binary's name and output format differ across platforms (`sha256sum`
# on most Linuxes, nothing on Windows), and a verification step that
# depends on an external binary being present is one that can quietly
# stop verifying. Already in the tree — rust-embed builds the same
# version for its own hashing — so this costs no extra compilation.
sha2 = "0.11"
rust-i18n = "4.2.3"
sys-locale = "0.3.2"
toml = "1.1.6"
# The alert webhook's JSON body (webhook.rs): strings a user's process
# names and paths end up in, so escaping is not something to write by
# hand. Already in the tree (zstats); `serde`
# itself stays an indirect dependency — the body is built with `json!`,
# nothing here derives. `preserve_order` by name: the body's keys are
# written in reading order and a receiver that prints it shows them in
# that order — asked for by name, not left to whichever other manifest
# happens to turn it on.
serde_json = { version = "1", features = ["preserve_order"] }
# Parallel directory walk for the Hardware tab's analyser (docs/
# disk-analysis.md). Same engine diskonaut uses; pinned to a dedicated
# 3-thread rayon pool at the call site so the resident collector's 2s
# disk-IO sampling never competes with a default-parallelism walk.
jwalk = "0.9"
# `kill(pid, 0)` and SIGTERM (`terminate.rs`), `statfs`/`statvfs` flags
# (`volflag.rs`), and `_SC_CLK_TCK` for `/proc` ages (`procscan`). Both
# supported platforms need it, so it sits here rather than in one of the
# target sections below.
libc = "0.2"

# Tracing to stdout + a daily-rolling file under ~/.zstats/logs
# (logger.rs, the zedis logger adapted). The zstats crate already emits
# tracing events (scheduler, alert engine) that were dropped for want of
# a subscriber; the app's own alert-class trail (deliveries, quits,
# trashes) lands there too. `local-time` gives the file local RFC 3339
# stamps; `time` is the fallback offset when detection fails.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["local-time"] }
tracing-appender = "0.2"
time = "0.3"

# Rasterises the tray SVG at startup — tray-icon only accepts raw RGBA, on
# every backend. Not under a target gate: the Linux tray is a
# StatusNotifierItem and needs the same bitmap the menu bar does.
resvg = "0.46"

# Content hashes for the disk window's duplicate finder (dupes.rs): a
# 64 KB head hash, then the whole file, only for files that already share a
# size. Fast enough that the read, not the hash, is the cost.
blake3 = "1.8.7"

# Tray, backend one of two: `NSStatusItem` on macOS, Shell_NotifyIcon on
# Windows.
#
# 0.25.1 is a floor, not a preference: every earlier version attaches the
# menu to the `NSStatusItem` for good and relies on a subview over the
# button to intercept clicks. macOS 27 stops forwarding left clicks to
# that subview while a menu is attached, so the menu opened and
# `with_menu_on_left_click(false)` — and with it the whole click path,
# panel toggle included — did nothing. 0.25.1 attaches the menu only
# while it is being presented (tauri-apps/tray-icon#365).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.25.1"

# The same crate on Linux, on its other backend. `ksni` speaks
# StatusNotifierItem over D-Bus and needs no GTK main loop — which is what
# this module was excluded over, since the default features
# (`libappindicator` + `muda-gtk3`) are that loop, a GTK 3 one, and it
# cannot coexist with the GTK 4 loop the NSH host runs. The two backends
# are alternatives, not a stack, hence
# `default-features = false`.
#
# Needs an SNI host on the session bus. Omarchy 4's Quickshell is one
# (measured 2026-09-18, `docs/omarchy-port.md` 阶段 3 carries the probe);
# without one the item simply never appears, which `tray.rs` degrades to
# rather than treating as a failure.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = [
    "ksni",
] }
# logind's idle inhibitor behind the keep-awake switch (`awake.rs`).
# Already in the tree under notify-rust and ksni, so nothing new builds;
# declared because `awake.rs` speaks to `org.freedesktop.login1` itself.
# The blocking API is the right one for two calls made from the UI
# thread when a switch is flipped.
zbus = "5.19"
# The NSH front end's Linux backend (GTK 4 widgets, Pango text), without
# its JS engine, as on macOS. It asks for GTK 4.14 (`gtk4`'s `v4_14`):
# Ubuntu 24.04 and Arch have it, Debian bookworm does not.
nsh-platform-linux = { version = "0.2.0", default-features = false }
# The panel as a wlr-layer-shell surface: anchored top-right by the
# compositor, which is the only one that may place it. On the `gtk4` NSH
# itself is built with, so the tree keeps one GTK binding.
gtk4-layer-shell = "0.8.1"

# AppKit and Foundation, spoken directly: the panel's window, the menu
# bar's scale factor (the tray reports physical pixels), notifications,
# the Trash. Same versions NSH itself is built on, so the tree keeps one
# objc2 of each.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSGeometry: NSPoint / NSRect for positioning the panel window.
# NSString and the bundle / file / URL types: notify.rs, Trash, boot-volume
# capacity. Banner delivery itself is UNUserNotificationCenter (the crate
# below), not NSUserNotificationCenter — that API is a silent no-op on
# macOS 26.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSGeometry",
    "NSString",
    # Real-bundle detection for the notification path: bare `cargo run`
    # has no .app, and UNUserNotificationCenter throws there.
    "NSBundle",
    # NSFileManager.trashItemAtURL — the Hardware tab's delete button is
    # Finder's own recoverable move-to-Trash, never a direct unlink.
    "NSError",
    "NSFileManager",
    "NSURL",
    # The boot volume's purgeable-space line: NSURL's two availability
    # capacities (the important-usage one is Finder's figure), read as
    # NSNumbers out of a keyed dictionary.
    "NSArray",
    "NSDictionary",
    "NSValue",
    # The NSH front end: its panel delegate's notifications, and the
    # uptime its debug probe stamps synthesised events with.
    "NSNotification",
    "NSObject",
    "NSProcessInfo",
] }
# Banner delivery. NSUserNotification — the deprecated API a bare binary
# could use — is a silent no-op on macOS 26 (measured: "delivered" logged,
# nothing shown, no ncprefs entry ever created; see docs/design.md
# 系统通知), so delivery goes through UNUserNotificationCenter, which
# requires a real .app bundle and the standard authorization prompt.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    # `UNNotificationRequest::requestWithIdentifier_content_trigger`
    # needs it beside the content one. gpui's own notification code turned
    # it on for us until a build without gpui showed nothing here asked.
    "UNNotificationTrigger",
    "block2",
    "std",
] }
# Completion-handler blocks for the UN calls above.
block2 = "0.6"
# SMAppService.mainApp backs the Interface page's launch-at-login
# switch: a login item the user can see and revoke in System Settings →
# General → Login Items — both directions are the OS's own mechanism.
objc2-service-management = { version = "0.3", default-features = false, features = [
    "SMAppService",
    # The class itself and its NSError-returning register/unregister are
    # gated behind these two, not behind SMAppService alone.
    "objc2",
    "objc2-foundation",
    "std",
] }
# The Interface page's keep-awake switch holds one IOKit power
# assertion (`awake.rs`). Already in the tree — zstats' battery
# readings pull the same version — so this costs no extra build.
objc2-io-kit = { version = "0.3", default-features = false, features = [
    "pwr_mgt",
    "std",
] }
# CFString for that assertion's type and name. Also already in the
# tree: objc2-app-kit below depends on it.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFString",
    "std",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    # NSAppearance backs the theme override: prefs.rs pins NSApp.appearance
    # so the vibrancy material follows a forced light/dark, not the system.
    "NSAppearance",
    "NSApplication",
    # The quit button on memory alert cards: terminate.rs sends the
    # ⌘Q-equivalent request through NSRunningApplication.
    "NSRunningApplication",
    # NSRunningApplication's pid accessors take and return `pid_t`, which
    # only exist with this feature. gpui's tree turned it on for us until
    # a build without gpui showed nothing here asked for it.
    "libc",
    "NSScreen",
    "NSVisualEffectView",
    "NSWindow",
    # active.rs: which app is frontmost, and the workspace notification
    # that says when that changes — public API, no entitlement.
    "NSWorkspace",
    "objc2-core-foundation",
    # The NSH front end's own panel (src/nsh/): a non-activating NSPanel
    # whose content view is NSH's AppView, the material under it, and the
    # synthesised events its debug probe drives it with.
    "objc2-quartz-core",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    # The disk-space window's folder pickers (`nsh/windows.rs`).
    "NSOpenPanel",
    "NSSavePanel",
    "NSPanel",
    "NSResponder",
    "NSView",
] }
# The NSH front end's macOS backend (AppKit views, CoreText text), and the
# main queue its engine threads hand AppKit work to. Same versions NSH
# itself is built on, so the tree keeps one objc2 of each.
nsh-platform-macos = { version = "0.2.0", default-features = false }
dispatch2 = "0.3.1"
# A canvas's content layer, whose asynchronous drawing the NSH front end
# turns off (src/nsh/host.rs, `draw_canvases_in_place`).
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
] }

# XDG banners. macOS delivery is UNUserNotificationCenter in notify.rs;
# this crate is not compiled into that binary. The wait_for_action
# transport is bounded on Linux because those banners auto-expire.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
