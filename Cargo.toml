[package]
name = "zstats-app"
version = "0.1.0"
edition = "2024"

# cargo-bundle has no field for `LSUIElement`, so `make bundle` writes it into
# Info.plist afterwards — see the Makefile.
[package.metadata.bundle]
name = "ZStats"
identifier = "com.github.vicanso.zstats"
icon = ["icons/zstats.icns"]
copyright = "Copyright © 2026 Tree xie. All rights reserved."
category = "public.app-category.utilities"
osx_minimum_system_version = "12.0"
short_description = "A menu bar metrics panel written in Rust and GPUI."

[dependencies]

# Matched pair with gpui-component. Current component tip depends on zed
# *without* a `rev=` — Cargo treats `git+…/zed?rev=X` and `git+…/zed` as
# different package identities even when the commit is identical, so we must
# use the same source form (no rev) here and let Cargo.lock pin the commit.
# Pin only gpui-component's rev; after upgrade, confirm a single gpui via
# `cargo tree -i gpui` and commit the lockfile.
# component: bc174a7ec4534b2a4174fddde314b38d30d69093
# zed (lockfile): 1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# gpui-component tip gates the native highlighter behind `tree-sitter`
# (older pins used cfg(not(wasm)) and needed no feature). Enables
# LanguageConfig / LanguageRegistry; pulls tree-sitter + tree-sitter-json
# only — not `tree-sitter-languages` (30+ parsers). Without this feature
# only the WASM stub is built and LanguageConfig has no constructor.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093", features = [
    "tree-sitter",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
gpui_macros = { git = "https://github.com/zed-industries/zed" }

# Embedded metrics collection. `frontend` brings the alert rule engine,
# rolling per-process averages and the settings model — and deliberately no
# tokio. `client` (the daemon's unix-socket probe) is left off for that reason.
zstats = { version = "0.2", default-features = false, features = ["frontend"] }
# Hands collected ticks (and tray events) from their blocking threads onto
# gpui's main-thread executor. Already in the tree via gpui.
smol = "2"
# Embeds `assets/` (fonts now; locales next) and zstd-compresses them in
# release. `default-features` off so debug builds embed too, instead of
# reading the folder at runtime.
rust-embed = { version = "8.12.0", default-features = false, features = [
    "compression",
] }
# Locale files live in `assets/locales/` (compressed by rust-embed). The
# `i18n!` macro is pointed at the empty `locales_stub/` so it does not
# codegen a  backend map; `i18n_loader` inflates one locale on first use.
rust-i18n = "4.1.0"
sys-locale = "0.3.2"
toml = "1.1.4"

# Tray. Linux is excluded on purpose — see "已知问题 / TODO" in README.md.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24.1"

# Only for the menu bar's scale factor: the tray reports physical pixels and
# gpui's `PlatformDisplay` doesn't expose a scale factor. Same versions gpui
# itself pins, so nothing new gets built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSResponder",
    "NSScreen",
    "NSVisualEffectView",
    "objc2-core-foundation",
] }


[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
