[package]
name = "zstats-app"
version = "0.1.2"
edition = "2024"

# The package cannot itself be called `zstats` — that name is taken by the
# metrics crate it depends on — but the binary target can: bin names play no
# part in dependency resolution. This is what names the executable inside
# the bundle (Contents/MacOS/zstats).
[[bin]]
name = "zstats"
path = "src/main.rs"

# cargo-bundle has no field for `LSUIElement`, so `make bundle` writes it into
# Info.plist afterwards — see the Makefile.
[package.metadata.bundle]
name = "zstats"
identifier = "com.github.vicanso.zstats"
icon = ["icons/zstats.icns"]
copyright = "Copyright © 2026 Tree xie. All rights reserved."
category = "public.app-category.utilities"
osx_minimum_system_version = "12.0"
short_description = "A menu bar metrics panel written in Rust and GPUI."

[dependencies]

# Matched pair with gpui-component. Current component tip depends on zed
# *without* a `rev=` — Cargo treats `git+…/zed?rev=X` and `git+…/zed` as
# different package identities even when the commit is identical, so we must
# use the same source form (no rev) here and let Cargo.lock pin the commit.
# Pin only gpui-component's rev; after upgrade, confirm a single gpui via
# `cargo tree -i gpui` and commit the lockfile.
# component: bc174a7ec4534b2a4174fddde314b38d30d69093
# zed (lockfile): 1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# No `tree-sitter` feature: it exists for LanguageConfig / the code
# editor's highlighter, which nothing here uses — dropping it sheds
# tree-sitter + tree-sitter-json from the binary. If a future component
# fails to compile wanting LanguageConfig, this is the switch.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
gpui_macros = { git = "https://github.com/zed-industries/zed" }

# Embedded metrics collection. `frontend` brings the alert rule engine,
# rolling per-process averages and the settings model — and deliberately no
# tokio. `client` (the daemon's unix-socket probe) is left off for that reason.
zstats = { version = "0.5", default-features = false, features = ["frontend"] }
# Dates for `records::read_range`, whose parameters are `jiff::civil::Date`
# and whose `MetricRecord::timestamp` is a `jiff::Timestamp`. Same version
# zstats already pins, so this resolves to the one copy it is already
# building — confirm with `cargo tree -i jiff` after any bump.
jiff = "0.2.35"
# Hands collected ticks (and tray events) from their blocking threads onto
# gpui's main-thread executor. Already in the tree via gpui.
smol = "2.0.2"
# Embeds `assets/` (fonts now; locales next) and zstd-compresses them in
# release. `default-features` off so debug builds embed too, instead of
# reading the folder at runtime.
# `include-exclude` powers the `#[include]` allowlist in `src/assets.rs`.
# Declared here rather than relied on through feature unification with
# gpui-component-assets, which is the only other crate turning it on.
rust-embed = { version = "8.12.0", default-features = false, features = [
    "compression",
    "include-exclude",
] }
# Locale files live in `assets/locales/` (compressed by rust-embed). The
# `i18n!` macro is pointed at the empty `locales_stub/` so it does not
# codegen a  backend map; `i18n_loader` inflates one locale on first use.
# Minimal blocking HTTP client for the clean-hints update fetch — the
# app's only network call, and strictly user-triggered. rustls avoids a
# native TLS dependency; socks-proxy so a configured socks:// URI
# actually connects (same shape as zedis).
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
    "socks-proxy",
] }
rust-i18n = "4.2.1"
sys-locale = "0.3.2"
toml = "1.1.4"
# Desktop banners. Cross-platform; macOS uses NSUserNotification
# (`set_application` + `wait_for_action` for the click that opens Alerts).
notify-rust = "4.18"
# Parallel directory walk for the Hardware tab's analyser (docs/
# disk-analysis.md). Same engine diskonaut uses; pinned to a dedicated
# 3-thread rayon pool at the call site so the resident collector's 2s
# disk-IO sampling never competes with a default-parallelism walk.
jwalk = "0.8"
# `AssetSource` returns `gpui::Result`, which is anyhow's — gpui re-exports
# the crate itself only under its `private` module ("here be dragons"), so
# naming a missing asset in the error needs the direct dependency. Already in
# the tree via gpui, so nothing extra gets built.
anyhow = "1"

# Tray. Linux is excluded on purpose — see "已知问题 / TODO" in README.md.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24.1"
# Rasterises the menu bar SVG at startup — tray-icon only accepts raw RGBA.
# Same version gpui already pulls in for its own icon rendering.
resvg = "0.46"

# Only for the menu bar's scale factor: the tray reports physical pixels and
# gpui's `PlatformDisplay` doesn't expose a scale factor. Same versions gpui
# itself pins, so nothing new gets built.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
# NSGeometry: NSPoint / NSRect for positioning the panel window.
# NSUserNotification + NSString: notify.rs delivers banners through
# NSUserNotificationCenter itself (fire-and-forget + resident delegate),
# rather than notify-rust's blocking wait_for_action transport.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSGeometry",
    "NSString",
    "NSUserNotification",
    # NSFileManager.trashItemAtURL — the Hardware tab's delete button is
    # Finder's own recoverable move-to-Trash, never a direct unlink.
    "NSError",
    "NSFileManager",
    "NSURL",
    # The boot volume's purgeable-space line: NSURL's two availability
    # capacities (the important-usage one is Finder's figure), read as
    # NSNumbers out of a keyed dictionary.
    "NSArray",
    "NSDictionary",
    "NSValue",
] }
raw-window-handle = "0.6"
# SMAppService.mainApp backs the Interface page's launch-at-login
# switch: a login item the user can see and revoke in System Settings →
# General → Login Items — both directions are the OS's own mechanism.
objc2-service-management = { version = "0.3", default-features = false, features = [
    "SMAppService",
    # The class itself and its NSError-returning register/unregister are
    # gated behind these two, not behind SMAppService alone.
    "objc2",
    "objc2-foundation",
    "std",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    # NSAppearance backs the theme override: prefs.rs pins NSApp.appearance
    # so the vibrancy material follows a forced light/dark, not the system.
    "NSAppearance",
    "NSApplication",
    # The quit button on memory alert cards: terminate.rs sends the
    # ⌘Q-equivalent request through NSRunningApplication.
    "NSRunningApplication",
    "NSScreen",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-core-foundation",
] }


[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# Size-optimise cold dependencies only (same shape as zedis) — the hot
# path (gpui layout/paint, zstats collection) keeps the default 3.
# Measured: 16.4 MiB → 12.5 MiB (with the tree-sitter feature drop);
# a global opt-level = "s" reached 10.7 MiB but would have slowed the
# per-frame code for 1.8 MiB nobody will notice on disk.
# Everything below runs rarely or once: image decoders decode a handful
# of images, the SVG stack rasterises one tray icon at startup, the
# fetch stack serves one user-triggered download, zstd inflates the
# embedded assets once.

# Image decoders (gpui's img element):
[profile.release.package.exr]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.qoi]
opt-level = "s"
[profile.release.package.tiff]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.zune-core]
opt-level = "s"
[profile.release.package.fdeflate]
opt-level = "s"

# SVG stack (gpui icon path; usvg parse → resvg + tiny-skia rasterize):
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"
[profile.release.package.rustybuzz]
opt-level = "s"
[profile.release.package.fontdb]
opt-level = "s"

# One user-triggered ~10 KB fetch pays for this whole TLS stack:
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.ring]
opt-level = "s"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.ureq]
opt-level = "s"

# Linked through rust-i18n's support crate; never on a per-frame path:
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.markdown]
opt-level = "s"

# Inflates the embedded assets once at startup:
[profile.release.package.zstd-sys]
opt-level = "s"
