# Clean-up hints for the directory analyser — annotation, not action.
#
# Each entry states two facts about a well-known cache location: which
# tool owns it, and (when the tool documents one) the tool's own cleanup
# command. The app only ever *shows* these on matching rows; it never
# runs a command or deletes anything based on this file.
#
# Entries come only from each tool's own documentation. Do not collect
# or import data from third-party cleanup rule sets.
#
# match semantics:
#   "~/path"  — exact directory, ~ expands to the user's home
#   "name"    — any directory whose last path component equals `name`
# command is optional — omit it when the tool has no documented cleanup
# command (the row is then labelled regenerable only).
# trashable = true marks a directory whose whole content is derived and
# safe to move to the Trash (the tool re-creates it) — these join the
# analyser's cleanup suggestions. Leave it off for anything holding user
# data (Docker volumes, simulator devices, pulled models, installed
# toolchains) or living inside working trees (node_modules, target):
# those stay annotation-only.
#
# A user copy at ~/.zstats/cleanhints.toml replaces this list wholesale
# (read once at launch).

# --- package managers -------------------------------------------------

[[hint]]
match = "~/.npm"
owner = "npm"
command = "npm cache clean --force"
trashable = true

[[hint]]
match = "~/Library/Caches/Yarn"
owner = "Yarn"
command = "yarn cache clean"
trashable = true

[[hint]]
match = "~/.yarn/berry/cache"
owner = "Yarn"
command = "yarn cache clean"
trashable = true

[[hint]]
match = "~/Library/pnpm/store"
owner = "pnpm"
command = "pnpm store prune"
trashable = true

[[hint]]
match = "~/Library/Caches/pnpm"
owner = "pnpm"
command = "pnpm store prune"
trashable = true

[[hint]]
match = "~/.bun/install/cache"
owner = "Bun"
command = "bun pm cache rm"
trashable = true

[[hint]]
match = "~/Library/Caches/Homebrew"
owner = "Homebrew"
command = "brew cleanup --prune=all"
trashable = true

[[hint]]
match = "~/Library/Caches/pip"
owner = "pip"
command = "pip cache purge"
trashable = true

[[hint]]
