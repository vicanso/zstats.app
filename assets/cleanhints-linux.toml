# --- special -------------------------------------------------------------

# The walk sees the XDG Trash (under ~/.local/share) — often tens of GB
# that only emptying actually frees. Never a trash suggestion itself.
[[hint]]
match = "~/.local/share/Trash"
owner = "Trash 废纸篓"

[[hint]]
match = "~/.local/share/Steam"
owner = "Steam"

