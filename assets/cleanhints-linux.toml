# Clean-up hints for the directory analyser, Linux list — annotation,
# not action.
#
# One file per operating system (cleanhints-<os>.toml), because a cache
# location is not a path that can be translated: ~/Library/Caches on
# macOS corresponds to ~/.cache ($XDG_CACHE_HOME) and ~/.config/<App>
# on Linux, the owning tools differ, and so do the documented cleanup
# commands.
#
# Each entry states two facts about a well-known cache location: which
# tool owns it, and (when the tool documents one) the tool's own cleanup
# command. The app only ever *shows* these on matching rows; it never
# runs a command or deletes anything based on this file.
#
# Entries come only from each tool's own documentation. Do not collect
# or import data from third-party cleanup rule sets.
#
# match semantics:
#   "~/path"  — exact directory, ~ expands to the user's home
#   "/path"   — exact absolute directory
#   "name"    — any directory whose last path component equals `name`
# command is optional — omit it when the tool has no documented cleanup
# command (the row is then labelled regenerable only).
# trashable = true marks a directory whose whole content is derived and
# safe to move to the Trash (the tool re-creates it) — these join the
# analyser's cleanup suggestions. Leave it off for anything holding user
# data (container volumes, pulled models, installed toolchains) or
# living inside working trees (node_modules, target): those stay
# annotation-only.
#
# A user copy at ~/.zstats/cleanhints-linux.toml replaces this list
# wholesale (read once at launch).

# --- package managers -------------------------------------------------

[[hint]]
match = "~/.npm"
owner = "npm"
command = "npm cache clean --force"
trashable = true

[[hint]]
match = "~/.cache/yarn"
owner = "Yarn"
command = "yarn cache clean"
trashable = true

[[hint]]
match = "~/.yarn/berry/cache"
owner = "Yarn"
command = "yarn cache clean"
trashable = true

[[hint]]
match = "~/.local/share/pnpm/store"
owner = "pnpm"
command = "pnpm store prune"
trashable = true

[[hint]]
match = "~/.cache/pnpm"
owner = "pnpm"
command = "pnpm store prune"
trashable = true

[[hint]]
match = "~/.bun/install/cache"
owner = "Bun"
command = "bun pm cache rm"
trashable = true

[[hint]]
match = "~/.cache/pip"
owner = "pip"
command = "pip cache purge"
trashable = true

[[hint]]
match = "~/.cache/uv"
owner = "uv"
command = "uv cache clean"

# uv's cache is hard-linked into environments (docs.astral.sh/uv/concepts/cache:
# "clearing the cache will break all installed packages"). Annotation only.

[[hint]]
match = "~/.cache/pypoetry"
owner = "Poetry"
command = "poetry cache clear --all ."
trashable = true

[[hint]]
match = "~/.m2/repository"
owner = "Maven"
command = "mvn dependency:purge-local-repository"
trashable = true

[[hint]]
match = "~/.gradle/caches"
owner = "Gradle"
trashable = true

[[hint]]
match = "~/.gradle/wrapper/dists"
owner = "Gradle"
trashable = true

[[hint]]
match = "~/.gradle/daemon"
owner = "Gradle"
trashable = true

[[hint]]
match = "~/.cache/composer"
owner = "Composer"
command = "composer clear-cache"
trashable = true

[[hint]]
match = "~/.composer/cache"
owner = "Composer"
command = "composer clear-cache"
trashable = true

[[hint]]
match = "~/.nuget/packages"
owner = "NuGet"
command = "dotnet nuget locals all --clear"
trashable = true

[[hint]]
match = "~/.pub-cache"
owner = "Dart / Flutter"
command = "dart pub cache clean"
trashable = true

[[hint]]
match = "~/.cache/yay"
owner = "yay"
command = "yay -Sc"
trashable = true

[[hint]]
match = "~/.cache/paru"
owner = "paru"
command = "paru -Sc"
trashable = true

