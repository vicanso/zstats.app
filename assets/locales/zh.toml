about_body = "按累计 CPU 时间排序，不是百分比——稳定占 8% 的进程消耗远超一次十分钟的满载，却从不越线，所以在别处看不到它。总量取自内核生命期计数器，漏采的分钟不影响准确性；睡眠的空隙不做插值。「今天」视图行下的色带是当天的时间轴：最左是 0 点、每格半小时，越深表示该时段记录到的峰值越高；空白表示那半小时没有记录——这不等于空闲。悬停色带可读出各时段的具体钟点。行内的内存数字是当日峰值。"
