memory = "Memory"
available_of = "available of %{total}"
used_of = "used of %{total}"
mem_curve_tip = "The bars are memory in use, as a percent of this machine, across 30 minutes split into 60 equal slots. Until that fills, the bars stay on the right and empty slots stay empty; the faint marks are 10 and 20 minutes ago. Each bar is a 30-second average, and the newest one is drawn brightest. The bottom is 0% and the top is 100%. Under the bars: the tallest bar, and how long the window has been collecting. Sampling continues every 5s while the panel is in the tray and every 2s while it is open."
pressure_tip_normal = "Kernel memory pressure is normal. This is macOS’s own verdict, not how much RAM is free."
pressure_tip_warning = "Kernel memory pressure is elevated. The compressor or swap is working; available GB can still look fine."
pressure_tip_critical = "Kernel memory pressure is critical. macOS may start jetsamming apps."
pressure_tip_none = "This platform does not report kernel memory pressure."
pressure_tip_waiting = "No kernel pressure level yet — this platform reports one, this sample just did not carry it."
used_tip = "Resident memory held by apps and the system, not including the compressed slice."
compressed_tip = "Pages squeezed by the macOS compressor. Growth is an early pressure signal."
free_tip = "RAM not currently held as resident or compressed."
mem_rise_lead = "Climbing this hour"
mem_rise_item = "%{name} +%{delta}"
mem_rise_tip = "Application trees whose memory footprint has climbed through the hour and is still at its high — the shape of a leak, which no threshold can see until it is too late. Newest minutes against the earliest reported ones; a tree that grew and freed again is not listed. Display only: nothing fires. A larger climb (a tenth of RAM, at least 1 GB) posts one silent banner."
swap_activity_lead = "Swapping"
swap_thrashing = "Thrashing"
swap_activity = "out %{outs}/s · in %{ins}/s"
swap_activity_tip = "Compressed memory moving to and from disk, counted in the kernel’s own unit: segments, bundles of compressed pages with no fixed size — so this is activity, not a byte rate. The badge says memory is tight; this says how hard macOS is working to stay there. Thrashing is the kernel’s own detector: segments written out only to be read straight back. Shown only while something moves."
pressure_tip_kernel = "The kernel counts %{pct}% of memory as available — the figure this verdict is derived from. It is lower than free GB because it leaves out memory the kernel will not reclaim."
pressure_badge = "%{level} · %{pct}% available"

