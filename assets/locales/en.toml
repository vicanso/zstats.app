about = "Why this differs"
about_body = "Ranked by CPU time consumed, not by percentage. A process at a steady 8% outspends a ten-minute burst at 100% several times over, while never crossing any threshold — so it appears nowhere else in this panel. Totals come from differencing the kernel's lifetime counter, which stays exact across the minutes a process was not recorded. Machine sleep leaves gaps; nothing is interpolated across them."
