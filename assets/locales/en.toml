top_apps_tip = "Each row is a launchd child plus every descendant, summed over the full table. 100% is one core, not the whole machine — the menu bar and the Processor headline are 0–100% of all cores, so these rows will not add up to that figure. Activity Monitor’s app row is the root process only, so the same name can read larger here. Trees refresh about every 15s; a spike the tray already shows can still be missing."
rising_title = "Climbing this hour"
busy_now = "busy now"
busy_now_tip = "Not climbing. The rows from here are the current CPU ranking, filling the card to three."
chart_gap_tip = "A dotted stretch along the bottom is time with nothing recorded — usually the Mac asleep, or the app not running."
rising_tip = "Trees whose last few minutes run well above their own average over the earlier hour — the news, not the residents. Ranked by the climb; the steady top spenders are one click away under All. When nothing is climbing, the card shows the current top instead. Row percents are still one core = 100%, not the tray’s whole-machine figure."
rise_row_tip = "Up %{delta} of one core against this tree’s average over the earlier part of the hour. Display only — no alert fires on a climb."
top_app_pct_tip = "Percent of one core. The Processor headline and the menu bar are 0–100% of the whole machine — this row will look smaller, and the list will not add up to that number."
p_cores = "P-cores"
e_cores = "E-cores"
freq_unknown = "freq —"
brand_freq = "%{brand} (%{freq})"
freq_tip = "The chip’s rated clock. It does not track live P/E-core frequency."
usage_tip = "Whole-machine usage, 0–100%, weighted by core count across P- and E-clusters — not the average of the two rows below. Same figure as the menu bar."
cpu_curve_tip = "The line is whole-machine usage across 30 minutes. Until that fills, the line stays on the right and the stretch before the first sample stays empty; the faint marks are 10 and 20 minutes ago. Each point is a 20-second average, at most 90 of them. The bottom is 0%. The top is 30% while every point stays at or under that, and the next 10% above the highest point once one goes over it (40, 50 … 100%); the figure in the top-left corner is that top. Under the line: the highest point drawn, and how long the window has been collecting. Sampling continues every 5s while the panel is in the tray and every 2s while it is open."
chart_peak = "Max"
chart_span = "Last"
load = "load %{one} · %{five} · %{fifteen}"
load_tip = "Load average over 1 / 5 / 15 minutes: threads running or queued for a CPU — a count, not a percentage. Read it against the %{cores} logical cores: below that, work gets served as it arrives; well above, it waits. 100% usage at load 3 and at load 30 are two different conditions."
uptime = "up %{time}"
uptime_tip = "Time since boot."
watts_tip = "Live power draw. Pairs with CPU%: the same 150% on the charger at 2 W is a different story from 150% drawing 22 W."
io_title = "Throughput"
io_disk = "Disk"
io_net = "Network"
net_curve_tip = "The bright line is download and the dim line is upload, across 30 minutes, on one scale. Until that fills, the lines stay on the right and the stretch before the first sample stays empty; the faint marks are 10 and 20 minutes ago. Each point is a 20-second average, at most 90 of them. The bottom is 0. The top is 1 MB/s while every point stays at or under that, and the next doubling above the highest point once one goes over it (2, 4, 8 MB/s…); the figure in the top-left corner is that top. Under the lines: the highest point of each, and how long the window has been collecting. The panel records a point every 5s in the tray and every 2s while open; the interface rates themselves refresh about every 15s. A break in a line is a reading with no rate."
io_off_body = "Disk and network collection are both off, or the first sample has nothing to diff against yet."
