space_extra_tip = "Apple's own figures: purgeable is the gap between available-for-important-usage (Finder's number) and plain available, freed by the system when space is actually needed — manual clearing is rarely required. What it holds varies: iCloud's optimized-storage local copies (evict per folder via Finder's Remove Download or brctl evict — the cloud copy stays), local Time Machine snapshots (tmutil thinlocalsnapshots, admin), and caches apps marked regenerable. Also the usual reason per-directory sums don't match \"used\". This app displays and never reclaims."
