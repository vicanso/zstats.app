cap_note = "Each row is a launchd child plus every descendant, summed over the full table. A tree rooted in a bare executable — a terminal session, an SSH login, a daemon — is labelled by the job holding its CPU, as the kernel groups it: a build typed into a shell reads `cargo`, whether one compiler or ten is running. The root's own name is in the expansion. An application whose tree such a job burns keeps its name and gains the job as a tail — `Zed · cargo` for a build in Zed's terminal — while its own helpers never rename it. Only the hottest trees are listed, same cap as Processes."
