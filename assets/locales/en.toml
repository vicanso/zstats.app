sort_cpu_tip = "Ranked by accumulated CPU time — the question this page exists to answer. On 7d/30d a full bar is the period's biggest spender; Today draws the time band instead."
sort_mem_tip = "Ranked by the highest recorded one-minute memory footprint. Only recorded minutes count (over a threshold, or top-5 CPU that minute) — not continuous monitoring. On 7d/30d a full bar is the period's biggest."
sort_growth_tip = "Ranked by how much the footprint grew between the first and last recorded minute — who leaked through the day. Only recorded minutes count, so a process seen once has no growth; one that freed memory reads negative and sinks. On 7d/30d a full bar is the period's biggest growth."
