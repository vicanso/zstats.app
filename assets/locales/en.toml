about_body = "Ranked by CPU time consumed, not percentage — a steady 8% outspends a ten-minute burst at 100% while never crossing a line, so it shows up nowhere else here. Totals come from the kernel's lifetime counters, so unrecorded minutes cost nothing; gaps left by sleep are not interpolated. The strip under a Today row is the day so far, midnight at the left, half-hour cells, darker = a louder recorded minute; blank means no record survived for that half hour — which is not the same as idle."
