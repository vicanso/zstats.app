keep_awake_tip = "Holds one macOS power assertion against idle system sleep, the same one `caffeinate -i` takes, so a long run finishes instead of the machine dozing off mid-way. It works on battery too, and `pmset -g assertions` names zstats as the holder. Two things it does not do: the display still sleeps, and closing the lid still sleeps the machine — no assertion outranks the lid. Quitting zstats always releases it, a crash included. While it is on the panel's footer shows a cup."
keep_awake_linux = "Keep the machine awake"
keep_awake_tip_linux = "Holds one logind idle inhibitor — the same one `systemd-inhibit --what=idle` takes — so a long run finishes instead of the machine dozing off mid-way. `systemd-inhibit --list` names zstats as the holder. It blocks idle sleep only: closing the lid or asking for suspend still sleeps the machine, and whether the screen still dims or locks is the idle daemon's own rule (hypridle honours the inhibitor unless configured not to). Quitting zstats always releases it, a crash included — the kernel closes the descriptor that holds it. While it is on the panel's footer shows a cup."
